# Web service on Render. Create it with: Render dashboard > New > Blueprint > this repo.
# No keys are needed. The service sleeps when idle; the portfolio page wakes it when someone opens the demo.
services:
  - type: web
    name: model-lab
    runtime: python
    plan: free
    buildCommand: pip install numpy scikit-learn
    startCommand: python -m modellab
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONPATH
        value: src
      - key: MODELLAB_BUDGET
        value: "75"
      - key: MODELLAB_MAX_ROWS
        value: "2000"

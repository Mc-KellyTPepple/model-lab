name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[bench]" pytest
      - run: python -m compileall -q src tests
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee out.txt || { grep -E "^(FAILED|E  )" out.txt | head -20 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
